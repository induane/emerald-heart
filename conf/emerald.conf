limit_req_zone $binary_remote_addr zone=ratelimit:30m rate=15r/s;

upstream emerald-heart {
    # Connection to app server
    server                      unix:/var/run/gunicorn/gunicorn.sock fail_timeout=0;
}

server {
    listen                      8080;
    listen                      [::]:8080;
    charset                     utf-8;

    # Allow POST body up to 2gb
    client_max_body_size        2G;
    gzip                        on;

    # Buffer body up to 8mb in memory before buffering to a file
    client_body_buffer_size     8M;

    location / {
      # checks for static file, if not found proxy to app
      try_files                 $uri @proxy_to_emerald_heart;
    }

    location @proxy_to_emerald_heart {
      proxy_set_header          X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header          X-Forwarded-Host $http_host;
      proxy_set_header          X-Forwarded-Proto $scheme;
      proxy_set_header          Host $http_host;
      proxy_set_header          HTTP_X_SENDFILE_AVAILABLE yes;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      gzip                      on;
      proxy_redirect            off;
      proxy_pass                http://emerald-heart;
    }

    location /s/emerald-heart/ {
        # API static files
        alias                   /emerald_heart/static/;
        # Don't bother logging staticfiles requests
        access_log              off;
        # Don't expire - we use cache busting (ManifestStaticFiles)
        expires                 max;
        # Use sendfile and customize tcp for static file sending
        sendfile                on;
        gzip                    on;
        sendfile_max_chunk      5m;
        tcp_nopush              on;
        tcp_nodelay             on;
        limit_req               zone=ratelimit burst=25;
    }

    location /uploads/ {
        # Internal serving of uploads via sendfile
        alias                   /emerald_heart/volume/uploads/;

        # Only allow access via emerald-heart-generated headers
        internal;

        # Use sendfile and customize tcp for serving uploaded files
        sendfile                on;
        sendfile_max_chunk      5m;
        tcp_nopush              on;
        tcp_nodelay             on;
        limit_req               zone=ratelimit burst=25;
    }

}
